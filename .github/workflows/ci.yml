# The continuous integration workflow: builds the solution with warnings as errors and runs every
# tier on both operating systems the application ships for, because a Windows-only or Linux-only
# break is the likeliest kind in a program with one engine and two window hosts.
#
#   build-and-test  build, the unit tier (guards included), the page suite and the tool suites
#   integration     the integration tier with the pinned ffmpeg; on Windows this runs the Media
#                   Foundation tests against a real Windows, on Linux the window tests under xvfb
#   end-to-end      the reduced speech test set built on the runner, the models tier over it (word
#                   error rate floors, containers, noise, speakers), a guard that the tier really
#                   ran, the command line transcribing en-10min.m4a (on Windows through Media
#                   Foundation and through ffmpeg, compared) and the clips benchmark
#   testset-parity  the test set files of both systems compared byte for byte
#   package         build/publish.ps1 without models, to prove the publish pipeline end to end
#
# Pushes to main, every pull request to main and a manual start run it; a newer run of the same
# ref cancels the older one. A feature branch is built when its pull request opens, so a push and
# its pull request are not built twice.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Restore
        run: dotnet restore

      # Each host builds its own desktop host: the Windows runner the web view host, the Linux
      # runner the GTK host. Warnings are errors, and CI=true also switches the trim analyzer on.
      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Unit tier, the guards included
        run: dotnet test --no-build --filter-not-trait "Tier=deep" --filter-not-trait "Tier=integration" --filter-not-trait "Tier=models" --ignore-exit-code 8

      - name: Page suite
        run: node --test "frontend/**/*.test.js"

      - name: Build tool suites
        run: node --test build/*.test.mjs

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Fetch ffmpeg
        uses: ./.github/actions/fetch-ffmpeg

      # The desktop host's window tests need the system web view libraries and a display, which
      # xvfb provides; Windows has both.
      - name: Install the window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 xvfb

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Integration tier
        if: runner.os == 'Windows'
        run: dotnet test --no-build --filter-trait "Tier=integration" --ignore-exit-code 8

      - name: Integration tier under a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet test --no-build --filter-trait "Tier=integration" --ignore-exit-code 8

  end-to-end:
    name: end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      MAT_BENCH_DATA: ${{ github.workspace }}/bench/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Fetch the model files
        uses: ./.github/actions/fetch-models

      - name: Fetch ffmpeg
        uses: ./.github/actions/fetch-ffmpeg

      # The builder verifies every cached source against the lock, so a damaged cache cannot pass.
      # Restored here and saved right after the build below rather than at the end of the job, so a
      # later failing step does not throw away 0.7 GB of downloads.
      - name: Restore the test set sources
        id: testset-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/.cache
          key: testset-${{ runner.os }}-${{ hashFiles('bench/testset/testset.lock') }}

      # Every clip, the noise files and the ten-minute files with en-10min's .m4a and .mp4, built with the pinned
      # ffmpeg that MAT_FFMPEG names; the listing of every file's hash goes to the parity job.
      - name: Build the reduced test set
        run: |
          node bench/testset/fetch-testset.mjs --subset ci --cache bench/.cache --out bench/data
          mkdir -p artifacts/e2e
          node bench/tools/ci-checks.mjs hashes bench/data > artifacts/e2e/testset-hashes.json

      - name: Save the test set sources
        if: steps.testset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/.cache
          key: testset-${{ runner.os }}-${{ hashFiles('bench/testset/testset.lock') }}

      - name: Keep the test set hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testset-hashes-${{ runner.os }}
          path: artifacts/e2e/testset-hashes.json
          if-no-files-found: error

      - name: Restore
        run: dotnet restore

      # Release, because the speed the command line reports below is the shipped build's.
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Models tier over the test set
        run: dotnet test --no-build -c Release --filter-trait "Tier=models" --ignore-exit-code 8 --report-xunit-trx --results-directory artifacts/e2e/trx

      # A missing file skips its test by name, so a green run proves nothing unless the tests ran:
      # the Pipeline suite runs 74 models-tier tests over the test set (73 here, where the pinned
      # export the graph comparison needs is not kept).
      - name: Check that the models tier ran over the audio
        run: node bench/tools/ci-checks.mjs tests artifacts/e2e/trx --suite MeetingAudioTranscriptor.Pipeline.Tests --min-run 70

      # The command line as a user runs it. On Windows the default decoder for .m4a must be Media
      # Foundation; a second run with MAT_PREFER_FFMPEG=1 decodes through ffmpeg, and the two
      # transcripts must agree to within 2 % of their words.
      - name: Transcribe en-10min.m4a with the command line
        env:
          RUNNER_KIND: ${{ runner.os }}
        run: |
          cli=src/MeetingAudioTranscriptor.Cli/bin/Release/net10.0/meeting-audio-transcriptor-cli.dll
          transcribe() {
            local into="artifacts/e2e/$1"
            mkdir -p "$into"
            dotnet "$cli" transcribe bench/data/long/en-10min.m4a --language en --formats vtt,json,txt --threads 4 --output "$into" > "$into/run.log" 2>&1 || { cat "$into/run.log"; exit 1; }
            echo "--- $1: summary"
            grep -E '^(Audio|Processing|Speed|Decoder|Speakers|Words):' "$into/run.log"
            echo "--- $1: the first 15 lines of en-10min.txt"
            head -n 15 "$into/en-10min.txt"
          }
          if [ "$RUNNER_KIND" = "Windows" ]; then
            unset MAT_PREFER_FFMPEG
            transcribe media-foundation
            if ! grep -Eq '^Decoder: +media-foundation' artifacts/e2e/media-foundation/run.log; then
              echo "::error::the Windows run did not decode en-10min.m4a through Media Foundation; read the Decoder line above"
              exit 1
            fi
            MAT_PREFER_FFMPEG=1 transcribe ffmpeg
            grep -Eq '^Decoder: +ffmpeg' artifacts/e2e/ffmpeg/run.log || { echo "::error::MAT_PREFER_FFMPEG=1 did not decode through ffmpeg"; exit 1; }
            node bench/tools/ci-checks.mjs transcripts artifacts/e2e/media-foundation/en-10min.json artifacts/e2e/ffmpeg/en-10min.json --max-percent 2
          else
            transcribe ffmpeg
          fi

      - name: Benchmark the clips
        env:
          RUNNER_KIND: ${{ runner.os }}
        run: |
          label="ci-$(echo "$RUNNER_KIND" | tr '[:upper:]' '[:lower:]')"
          dotnet src/MeetingAudioTranscriptor.Cli/bin/Release/net10.0/meeting-audio-transcriptor-cli.dll benchmark --set clips --threads 4 --label "$label" --data bench/data --out artifacts/e2e/benchmark

      - name: Keep the benchmark result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ runner.os }}
          path: artifacts/e2e/benchmark/*.json
          if-no-files-found: error
          retention-days: 30

  testset-parity:
    name: testset-parity
    needs: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download both systems' hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: hashes
          pattern: testset-hashes-*

      # The WAV files, references and RTTM must be the same bytes on both systems; only the
      # encoded copies may differ, because their bytes depend on the ffmpeg build's encoders.
      - name: Compare them
        run: node bench/tools/ci-checks.mjs parity hashes/testset-hashes-Linux/testset-hashes.json hashes/testset-hashes-Windows/testset-hashes.json

  package:
    name: package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Fetch ffmpeg
        uses: ./.github/actions/fetch-ffmpeg

      # Without models, so the job stays quick and its archive is named "-nomodels" and can never be
      # taken for a release. It still publishes both executables, checks the shared runtime, removes
      # the unneeded files, refuses unexpected ones and runs the smoke test on the staged folder.
      - name: Publish without models
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: ./build/publish.ps1 -Rid $env:RID -SkipModels
